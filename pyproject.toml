[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "research_tools"
version = "0.5.0"
description = "Set of tools to be used in scientific research projects."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "Bruno Correia", email = "brunoviniciusac@gmail.com" }]
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "pandas",
    "seaborn",
    "pyarrow",
    "rich",
    "xlrd",
    "openpyxl",
    "odfpy",
    "py7zr",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-cov",
    "ruff",
]

[project.urls]
Homepage = "https://github.com/bruno-vacorreia/Research_tools"
Repository = "https://github.com/bruno-vacorreia/Research_tools"
Issues = "https://github.com/bruno-vacorreia/Research_tools/issues"
Contributors = "https://github.com/bruno-vacorreia/Research_tools/graphs/contributors"

[tool.setuptools.packages.find]
exclude = ["dump_data*", "tests*", "build*"]
